[package]
name = "corral"
version = "0.1.0"
edition = "2024"

[dependencies]
windows = { version = "0.61.1", features = ["Win32_Foundation","Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input", "Win32_UI_Input_KeyboardAndMouse"] }
winapi = { version = "0.3.9", features = ["minwindef"] }
winit = "0.29"
softbuffer = "0.4"
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "winuser", "windef", "libloaderapi", "wingdi", "errhandlingapi",
    "shellapi", "shlobj", "impl-default",
    "fileapi", "synchapi", "winbase", "handleapi", "winnt"
] }